[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
# All entries are OSI-approved and FSF-free. The two beyond the permissive
# baseline come from the dependency tree: Zlib (foldhash, via petgraph's
# hashbrown) and ISC (is_ci, via miette's supports-color).
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "ISC"]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
